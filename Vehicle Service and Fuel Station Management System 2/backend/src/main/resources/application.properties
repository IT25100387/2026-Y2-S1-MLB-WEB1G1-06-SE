spring.application.name=Fuel Station and Inventory Management

# ==========================================
# Embedded H2 Database (Active for macOS / Local Dev)
# ==========================================
spring.datasource.url=jdbc:h2:file:${fuelcore.database-path:./data/fuelstationdb};DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=1111
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ==========================================
# Microsoft SQL Server Database (Alternative for Windows/Docker)
# ==========================================
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=fuelstationdb;encrypt=false;trustServerCertificate=true
# spring.datasource.username=sa
# spring.datasource.password=FuelStation123!
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Auto update schema
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Station time and email recovery (set environment variables before starting)
app.station.time-zone=Asia/Colombo
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.enabled=${SMTP_ENABLED:false}
app.mail.from=${SMTP_FROM:}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Development fixtures are enabled explicitly; normal restarts do not overwrite records.
app.demo.seed=${DEMO_SEED:true}
app.browser.open=false

# Hibernate owns the active H2 schema; legacy SQL Server scripts are not auto-run.
spring.sql.init.mode=never

# Keep normal runtime logs readable.
logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=INFO

# Restart explicitly to avoid concurrent H2 file opens during classpath updates.
spring.devtools.restart.enabled=false

# Catalog photos are optional; existing JSON CRUD requests remain supported.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Cashier hosted card checkout. Secrets stay on the backend; no card numbers are collected here.
app.payhere.merchant-id=${PAYHERE_MERCHANT_ID:}
app.payhere.merchant-secret=${PAYHERE_MERCHANT_SECRET:}
app.payhere.notify-url=${PAYHERE_NOTIFY_URL:}
app.payhere.sandbox=${PAYHERE_SANDBOX:true}
