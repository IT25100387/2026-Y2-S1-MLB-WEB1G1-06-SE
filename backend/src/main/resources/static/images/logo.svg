<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
    <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FCD34D" />
            <stop offset="50%" stop-color="#F59E0B" />
            <stop offset="100%" stop-color="#D97706" />
        </linearGradient>
        <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#FEF08A" />
        </linearGradient>
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D97706" flood-opacity="0.35"/>
        </filter>
    </defs>
    
    <!-- Logo Icon Group -->
    <g transform="translate(6, 6)">
        <!-- Rounded Hexagon Base -->
        <polygon points="26,2 48,14 48,38 26,50 4,38 4,14" fill="url(#goldGrad)" filter="url(#softGlow)" rx="6"/>
        
        <!-- Energy Droplet & Spark -->
        <path d="M26,10 C26,10 36,22 36,28 C36,33.52 31.52,38 26,38 C20.48,38 16,33.52 16,28 C16,22 26,10 26,10 Z" fill="#FFFFFF" opacity="0.95"/>
        
        <!-- Electric / Lightning Dynamic Core -->
        <path d="M27,15 L21,26 L26,26 L23,35 L31,24 L26,24 Z" fill="url(#goldGrad)"/>
    </g>

    <!-- Typography Group -->
    <g transform="translate(68, 14)">
        <!-- "FuelCore" Wordmark -->
        <text x="0" y="24" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
            Fuel<tspan fill="#D97706">Core</tspan>
        </text>
        
        <!-- Subtitle Tracking -->
        <text x="1" y="38" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#B45309" letter-spacing="1.8">
            ENERGY &amp; MOBILITY OS
        </text>
    </g>
</svg>
