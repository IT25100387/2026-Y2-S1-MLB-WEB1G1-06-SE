<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56">
    <defs>
        <linearGradient id="goldIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FDE047" />
            <stop offset="50%" stop-color="#F59E0B" />
            <stop offset="100%" stop-color="#D97706" />
        </linearGradient>
        <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#D97706" flood-opacity="0.4"/>
        </filter>
    </defs>
    
    <!-- Rounded Hexagon Base -->
    <polygon points="28,3 51,16 51,40 28,53 5,40 5,16" fill="url(#goldIconGrad)" filter="url(#iconShadow)"/>
    
    <!-- Fuel Droplet Shape -->
    <path d="M28,12 C28,12 39,24 39,31 C39,37 34,42 28,42 C22,42 17,37 17,31 C17,24 28,12 28,12 Z" fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Lightning Energy Bolt -->
    <path d="M29,17 L23,29 L28,29 L25,38 L34,27 L28,27 Z" fill="url(#goldIconGrad)"/>
</svg>
